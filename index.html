*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:640px;margin-inline:auto;padding:16px}
.brand{display:flex;align-items:center;gap:10px;margin:0 0 2px}.brand b{font-size:26px;letter-spacing:.3px}.brand svg{flex:none}
.sub{color:var(--mu);font-size:14px;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;font-size:15px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.t{font-weight:700;font-size:18px;color:var(--ac)}
.mu{color:var(--mu);font-size:14px}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:6px;padding:2px 8px;font-size:13px;font-weight:600}
.note{margin-top:6px;font-size:14px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:600}
.btn.no{background:var(--dg)}
.ic{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;width:38px;height:38px;font-size:16px}
.del{background:none;border:0;color:var(--dg);font-size:14px;padding:4px}
.hint{background:var(--ac2);border-radius:10px;padding:10px;font-size:14px;margin-bottom:10px}
.st{border:0;border-radius:16px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700}
.st.c{background:var(--ac2);color:var(--ac)}.st.a{background:var(--wa2);color:var(--wa)}.st.r{background:#f6dcd7;color:var(--dg)}
.cnt{display:flex;gap:8px;margin-bottom:12px}
.cnt div{flex:1;text-align:center;border-radius:10px;padding:8px;font-size:13px;font-weight:600}
.cnt b{display:block;font-size:22px}
.phone{border:2px dashed var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.phone .big{display:flex;gap:8px;margin-top:10px}.phone .big button{flex:1;padding:14px}
.lines{margin-top:6px;font-size:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g3 input{margin:0}</style>
</head>

r 17","h":"Email","e":"Épreuve à préciser","s":"c","p":"15:25","d":30,"n":""},{"c":"Cavalier 17","h":"Jango","e":"Épreuve à préciser","s":"c","p":"15:57","d":27,"n":"Seller dans la carrière de détente. Un cavalier promène le cheval en main sur le parking à 15h15, puis l'amène en détente à 15h30."}];

function g(i){return document.getElementById(i)}
function tab(n){[1,2,3].forEach(function(i){g("p"+i).hidden=i!=n;g("t"+i).className=i==n?"on":""})}
function mins(h){var a=h.split(":");return +a[0]*60+ +a[1]}
function fmt(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var L={c:"✔ Confirmé",a:"⏳ En attente",r:"✖ Refusé"};
function opts(){return EP.map(function(e){return '<option'+(e=="Club 2"?' selected':'')+'>'+e+'</option>'}).join("")}
function form(pf,times,title,btn){
  function tour(k){return `<div class="mu" style="margin:4px 0">Tour ${k}</div><div class="g"><select id="${pf}e${k}" onchange="eh('${pf}',${k})">${opts()}</select>${hfield(pf,k)}</div>`+(times?`<div class="g"><div><div class="mu">Passage</div><input type="time" id="${pf}p${k}" value="09:00"></div><div><div class="mu">Détente (min avant)</div><input type="number" id="${pf}d${k}" value="30" min="0"></div></div>`:"")}
  return `<div class="card"><b>${title}</b><div style="height:8px"></div><div class="g">${cfield(pf)}<select id="${pf}n" onchange="tg('${pf}')"><option value="1">1 tour</option><option value="2">2 tours</option><option value="3">3 tours</option></select></div>${tour(1)}<div id="${pf}t2" hidden><div class="mu" style="margin-bottom:6px">Même épreuve avec un autre cheval, ou autre épreuve (même cheval ou non).</div>${tour(2)}</div><div id="${pf}t3" hidden><div class="mu" style="margin-bottom:6px">Troisième passage.</div>${tour(3)}</div><input id="${pf}o" placeholder="Précisions"><button class="btn" onclick="addF('${pf}',${times})">${btn}</button></div>`}
function cfield(pf){
  var sn=`<input id="${pf}cn" placeholder="Nom de famille ou initiale (si doublon)" style="margin:0">`;
  if(!CL.length)return `<div><input id="${pf}c" placeholder="Cavalier" style="margin:0 0 8px">${sn}</div>`;
  return `<div><select id="${pf}cs" onchange="cs('${pf}')" style="margin:0 0 8px"><option value="">Cavalier…</option>${CL.map(function(h){return '<option>'+esc(h)+'</option>'}).join("")}<option value="__autre">Autre cavalier…</option></select><input id="${pf}c" placeholder="Prénom" hidden style="margin:0 0 8px">${sn}</div>`}
function cs(pf){g(pf+"c").hidden=g(pf+"cs").value!="__autre";ah(pf)}
function cv(pf){var s=g(pf+"cs"),b=s?(s.value=="__autre"?g(pf+"c").value:s.value):g(pf+"c").value;b=b.trim();if(!b)return "";var n=g(pf+"cn").value.trim();return n?b+" "+n:b}
function cclear(pf){var s=g(pf+"cs");g(pf+"c").value="";g(pf+"cn").value="";if(s){s.value="";g(pf+"c").hidden=true;ah(pf)}}
function saveCL(){var C=[];g("clt").value.split("\n").forEach(function(x){x=x.trim();if(x&&C.indexOf(x)<0)C.push(x)});CL=C.sort(function(a,b){return a.localeCompare(b,"fr")});CLV=1000;buildForms();save()}
function hopts(po,hab){
  var o=function(a){return a.map(function(h){return '<option>'+esc(h)+'</option>'}).join("")};
  var c=HL.length?'<optgroup label="Chevaux">'+o(HL)+'</optgroup>':"",p=HP.length?'<optgroup label="Poneys">'+o(HP)+'</optgroup>':"";
  return (hab&&hab.length?'<optgroup label="Habituels">'+o(hab)+'</optgroup>':"")+(po?p+c:c+p)}
function habs(pf){var s=g(pf+"cs"),b=s&&s.value&&s.value!="__autre"?s.value:"";return HAB[b]||[]}
function ah(pf){var hab=habs(pf);for(var k=1;k<=3;k++){var s=g(pf+"h"+k+"s");if(!s)continue;var cur=s.value,auto=(cur===""||cur===s._auto),nv=auto?(k==1?(hab[0]||""):""):cur;s._auto=(auto&&k==1&&nv)?nv:undefined;var po=g(pf+"e"+k).value.indexOf("Poney")==0;s.innerHTML='<option value="">Cheval…</option>'+hopts(po,hab)+'<option value="__autre">Autre cheval…</option>';s.value=nv;hs(pf,k)}}
function habText(){return Object.keys(HAB).filter(function(k){return HAB[k].length}).sort(function(a,b){return a.localeCompare(b,"fr")}).map(function(k){return k+" - "+HAB[k].join(" et ")}).join("\n")}
function saveHAB(){var all={};HL.concat(HP).forEach(function(h){all[h.toLowerCase()]=h});var cl={};CL.forEach(function(c){cl[c.toLowerCase()]=c});var H={};
  g("hbt").value.split("\n").forEach(function(l){var m=l.split(/\s+-\s+/);if(m.length<2)return;var n=m[0].trim();n=cl[n.toLowerCase()]||n;var hs=m.slice(1).join(" - ").split(/\s+et\s+|\s*,\s*/).map(function(x){x=x.trim();return all[x.toLowerCase()]||x}).filter(Boolean);if(n&&hs.length)H[n]=hs});
  HAB=H;HABV=1000;buildForms();save()}
function hfield(pf,k){
  if(!HL.length&&!HP.length)return `<input id="${pf}h${k}" placeholder="Cheval">`;
  return `<div><select id="${pf}h${k}s" onchange="hs('${pf}',${k})" style="margin:0 0 8px"><option value="">Cheval…</option>${hopts(false,[])}<option value="__autre">Autre cheval…</option></select><input id="${pf}h${k}" placeholder="Nom du cheval" hidden style="margin:0"></div>`}

function hv(pf,k){var s=g(pf+"h"+k+"s");if(s)return s.value=="__autre"?g(pf+"h"+k).value.trim():s.value;return g(pf+"h"+k).value.trim()}

function tg(pf){var n=+g(pf+"n").value;g(pf+"t2").hidden=n<2;g(pf+"t3").hidden=n<3}

  var c=cv(pf),n=+g(pf+"n").value;if(!c)return;
  for(var k=1;k<=n;k++){if(!hv(pf,k))return}
  for(k=1;k<=n;k++){D.push({c:c,h:hv(pf,k),e:g(pf+"e"+k).value,s:times?"c":"a",p:times?g(pf+"p"+k).value:"",d:times?(+g(pf+"d"+k).value||0):30,n:k==1?g(pf+"o").value:""})}
  cclear(pf);g(pf+"o").value="";for(k=1;k<=3;k++)hclear(pf,k);render()}

  RL=[];D.forEach(function(x){if(RL.indexOf(x.c)<0)RL.push(x.c)});

  g("who").innerHTML=RL.map(function(c,i){return `<option value="${i}"${i==cur?" selected":""}>${esc(c)}</option>`}).join("");
  var r=RL[cur];
  g("rv").innerHTML=r?`<div><b>Concours</b><div class="mu">${esc(r)} · ${ps(r).length} tour${ps(r).length>1?"s":""}</div>${lines(r)}</div>`+(ps(r)[0].s=="a"?`<div class="big"><button class="btn" onclick="setS(${cur},'c')">Je confirme</button><button class="btn no" onclick="setS(${cur},'r')">Je ne viens pas</button></div>`:`<div style="margin-top:8px"><span class="st ${ps(r)[0].s}">${L[ps(r)[0].s]}</span> <button class="del" onclick="setS(${cur},'a')">Modifier</button></div>`):"";
  g("list").innerHTML=RL.map(function(c,i){var s=ps(c)[0].s;return `<div class="card"><div class="row"><div><b>${esc(c)}</b><div class="mu">${ps(c).length} tour${ps(c).length>1?"s":""}</div></div><button class="st ${s}" onclick="cyc(${i})">${L[s]}</button></div>${lines(c)}<button class="del" onclick="rmR(${i})">Supprimer le cavalier</button></div>`}).join("")||'<div class="mu">Aucun engagement.</div>';
  var C=D.map(function(x,i){return{x:x,i:i}}).filter(function(o){return o.x.s=="c"}).sort(function(a,b){return(a.x.p?mins(a.x.p):9999)-(b.x.p?mins(b.x.p):9999)});
  g("plan").innerHTML=C.map(function(o){var x=o.x,all=ps(x.c),k=all.indexOf(x)+1;return `<div class="card"><div class="row"><div><b>${esc(x.c)}</b> · ${esc(x.h)}<div class="mu">${esc(x.e)}${all.length>1?" · tour "+k+"/"+all.length:""}</div></div><div style="text-align:right">${x.p?'<span class="tag">Détente '+fmt(mins(x.p)-x.d)+'</span>':'<span class="mu">heure à définir</span>'}</div></div><div class="g" style="margin-top:8px"><div><div class="mu">Passage</div><input type="time" value="${x.p}" onchange="setP(${o.i},this.value)" style="margin:0"></div><div><div class="mu">Détente (min avant)</div><input type="number" value="${x.d}" min="0" onchange="setD(${o.i},this.value)" style="margin:0"></div></div>${x.n?'<div class="note">📝 '+esc(x.n)+'</div>':""}<button class="del" onclick="rm(${o.i})">Supprimer</button></div>`}).join("")||'<div class="mu">Aucun engagement confirmé.</div>';
  var hs=[];C.forEach(function(o){if(hs.indexOf(o.x.h)<0)hs.push(o.x.h)});
  T=T.filter(function(h){return hs.indexOf(h)>-1});
  hs.forEach(function(h){if(T.indexOf(h)<0)T.push(h)});
  if(TR){TR=TR.filter(function(h){return hs.indexOf(h)>-1});hs.forEach(function(h){if(TR.indexOf(h)<0)TR.push(h)})}
  if(!vv(CV))CV=V[0].id;
  var M=tm(CV)[CD],cv=vv(CV),VL=vlist(CV,CD),over=VL.length>cv.cap,free=[];
  ["Camion","Van"].forEach(function(t){if(V.filter(function(v){return v.type==t}).length<2)free.push(t)});
  g("thint").innerHTML=`<div class="hint">${CD=="a"?"Le premier de la liste monte en premier. Mets en dernier le cheval qui passe en premier : il sort en premier.":"Par défaut, mêmes véhicules et même ordre que l'aller. Modifie-les si besoin."}${CD=="r"&&(TR||Object.keys(AR).length)?' <button class="del" onclick="resetR()">Rétablir comme l\'aller</button>':""}</div>`;
  g("truck").innerHTML=`<select id="veh" onchange="setCV(this.value)">`+V.map(function(v){return `<option value="${v.id}"${v.id==CV?" selected":""}>${esc(v.name)} (${vlist(v.id,CD).length} chevaux)</option>`}).join("")+`</select>`
  +(free.length?`<div class="g" style="margin-bottom:10px"><select id="addv" style="margin:0">`+free.map(function(t){return `<option>${t}</option>`}).join("")+`</select><button class="btn" onclick="addV()">+ Ajouter</button></div>`:"")
  +`<div class="tabs"><button class="${CD=="a"?"on":""}" onclick="setCD('a')">Aller</button><button class="${CD=="r"?"on":""}" onclick="setCD('r')">Retour</button></div><div class="card"><div class="g3"><div><div class="mu">Chargement</div><input type="time" value="${M.l}" onchange="setM('l',this.value)"></div><div><div class="mu">Départ</div><input type="time" value="${M.d}" onchange="setM('d',this.value)"></div><div><div class="mu">Arrivée</div><input type="time" value="${M.r}" onchange="setM('r',this.value)"></div></div></div>`
  +`<div class="card"><div class="g"><input value="${esc(cv.name)}" onchange="setVN(this.value)" style="margin:0"><input type="number" value="${cv.cap}" min="1" onchange="setVC(this.value)" style="margin:0" placeholder="Places"></div><div class="row" style="margin-top:8px"><span class="mu"${over?' style="color:var(--dg)"':""}>${VL.length} / ${cv.cap} chevaux${over?" – trop de chevaux":""}</span>${V.length>1?'<button class="del" onclick="delV()">Supprimer ce véhicule</button>':""}</div></div>`
  +(VL.map(function(h,i){var P=C.filter(function(o){return o.x.h==h}).map(function(o){return o.x});var who=P.map(function(x){return x.c}).filter(function(v,j,a){return a.indexOf(v)==j}).join(", ");var first=P.filter(function(x){return x.p}).map(function(x){return x.p}).sort()[0];return `<div class="card"><div class="row"><div><span class="tag">${i+1}</span> <b>${esc(h)}</b><div class="mu">${esc(who)}${first?" · 1er passage "+first:""}</div></div><div><button class="ic" onclick="mv(${i},-1)">↑</button> <button class="ic" onclick="mv(${i},1)">↓</button></div></div>`+(V.length>1?`<select onchange="toV(${i},this.value)" style="margin:8px 0 0"><option value="">Changer de véhicule…</option>`+V.filter(function(v){return v.id!=CV}).map(function(v){return `<option value="${v.id}">→ ${esc(v.name)}</option>`}).join("")+`</select>`:"")+`</div>`}).join("")||'<div class="mu">Aucun cheval dans ce véhicule.</div>');
  g("rs").innerHTML='<button class="del" onclick="resetAll()">'+(RS?"Confirmer : tout effacer":"Nouveau concours (tout effacer)")+'</button>';
  save()}
function vv(id){return V.filter(function(v){return v.id==id})[0]}
function effV(h,d){var x=d=="a"?AA[h]:(AR[h]||AA[h]);return vv(x)?x:V[0].id}
function vlist(id,d){return (d=="a"?T:(TR||T)).filter(function(h){return effV(h,d)==id})}
function tm(id){if(!TM[id])TM[id]={a:{l:"",d:"",r:""},r:{l:"",d:"",r:""}};return TM[id]}
function mv(i,d){var L=vlist(CV,CD),j=i+d;if(j<0||j>=L.length)return;var A=CD=="a"?T:(TR||(TR=T.slice())),a=A.indexOf(L[i]),b=A.indexOf(L[j]),t=A[a];A[a]=A[b];A[b]=t;render()}
function toV(i,v){if(!v)return;var h=vlist(CV,CD)[i];if(CD=="a")AA[h]=+v;else AR[h]=+v;render()}
function setCD(d){CD=d;render()}
function setCV(v){CV=+v;render()}
function setM(k,v){tm(CV)[CD][k]=v;save()}
function setVN(v){if(v.trim())vv(CV).name=v.trim();render()}
function setVC(v){vv(CV).cap=Math.max(1,+v||1);render()}
function addV(){var t=g("addv").value,n=1;while(V.some(function(v){return v.name==t+" "+n}))n++;var id=NV++;V.push({id:id,name:t+" "+n,type:t,cap:t=="Van"?2:6});CV=id;render()}
function delV(){if(V.length<2)return;V=V.filter(function(v){return v.id!=CV});delete TM[CV];CV=V[0].id;render()}
function resetR(){TR=null;AR={};render()}
var RS=false;
function resetAll(){if(!RS){RS=true;render();return}RS=false;D=[];T=[];TR=null;AA={};AR={};Object.keys(TM).forEach(function(k){TM[k]={a:{l:"",d:"",r:""},r:{l:"",d:"",r:""}}});render()}
buildForms();
render();
</script>
</body>
</html>
